name: russian-tokenizer

services:
  notebook:
    build: .
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8889}:8888"
    volumes:
      - .:/workspace
      - huggingface-cache:/cache/huggingface
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/login', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  huggingface-cache:
